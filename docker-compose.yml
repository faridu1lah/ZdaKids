services:
  postgres:
    image: postgres:17-alpine
    container_name: zdakids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zdakids
      POSTGRES_USER: zdakids
      POSTGRES_PASSWORD: zdakids
    ports:
      - '5432:5432'
    volumes:
      - zdakids_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zdakids -d zdakids']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zdakids_postgres_data:
